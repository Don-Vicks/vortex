[workspace]
members = [
    "crates/core",
    "crates/geyser",
    "crates/jito",
    "crates/lifecycle",
    "crates/agent",
    "crates/failures",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
solana-sdk = "1.18"
solana-client = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
