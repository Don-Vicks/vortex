[package]
name = "solana-tx-stack"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
solana-sdk = "1.18"
solana-client = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"

[workspace]
members = [
    "crates/core",
    "crates/geyser",
    "crates/jito",
    "crates/lifecycle",
    "crates/agent",
    "crates/failures",
]
resolver = "2"
