[package]
name = "solana-vortex"
version = "0.1.3"
edition = "2021"
description = "A dynamic decision engine and transaction stack to automatically evaluate Solana network conditions, protect against MEV, and conditionally tip Jito bundles."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Don-Vicks/solana-tx-stack"
readme = "README.md"
keywords = ["solana", "jito", "mev", "vortex"]

[dependencies]
solana-sdk.workspace = true
solana-client.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
yellowstone-grpc-client = "1.15.0"
yellowstone-grpc-proto = "1.14.2"
bs58 = "0.5.1"
tokio-stream = "0.1"
bincode = "1.3.3"
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
thiserror = "2.0.18"
futures-util = "0.3.32"

[build-dependencies]
tonic-build = "0.10"
