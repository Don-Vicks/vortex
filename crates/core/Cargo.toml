[package]
name = "core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
lifecycle = { path = "../lifecycle" }
geyser = { path = "../geyser" }
jito = { path = "../jito" }
agent = { path = "../agent" }
failures = { path = "../failures" }
solana-client = "1.18.0"
solana-sdk = "1.18.0"
